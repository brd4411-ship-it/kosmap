<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코스맵 KOSMAP — 한국 주식 히트맵</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --bg:#070B14; --panel:#0C1220; --panel2:#0F1728; --line:rgba(148,163,196,.14);
  --tx:#E9EEF8; --tx2:#8B96AC; --tx3:#5A6478;
  --gold:#F7C948; --up:#FF4A3C; --dn:#4B7BFF; --flat:#566072;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── 상단 바 ─────────────────────────── */
#topbar{display:flex;align-items:center;gap:14px;height:54px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
#topbar::-webkit-scrollbar{display:none}
.wordmark{display:flex;align-items:center;gap:8px;flex-shrink:0}
.wordmark .dia{color:var(--gold);font-size:15px;transform:translateY(-1px)}
.wordmark b{font-size:17px;font-weight:900;letter-spacing:.06em}
.wordmark small{font-size:10px;color:var(--tx2);letter-spacing:.14em;margin-top:2px}
#chips{display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:baseline;gap:7px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);white-space:nowrap;flex-shrink:0}
.chip .lb{font-size:10px;color:var(--tx2);letter-spacing:.06em}
.chip .vl{font-size:12.5px;font-weight:600}
#status{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:11px;color:var(--tx2);white-space:nowrap;flex-shrink:0}
#status .dot{width:7px;height:7px;border-radius:50%;background:var(--flat);flex-shrink:0}
#status.live .dot{background:#3DDC7C;animation:pulse 2s infinite}
#status.closed .dot{background:var(--tx3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#refreshBtn{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--tx2);flex-shrink:0;transition:color .15s,border-color .15s}
#refreshBtn:hover{color:var(--tx);border-color:var(--tx2)}
#refreshBtn.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.spacer{flex:1}

/* ── 툴바 ─────────────────────────── */
#toolbar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;flex-shrink:0}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel2)}
.seg button{padding:7px 14px;font-size:12.5px;color:var(--tx2);border:none;background:none;transition:background .15s,color .15s}
.seg button.on{background:rgba(247,201,72,.12);color:var(--gold);font-weight:700}
.seg button:not(.on):hover{color:var(--tx)}
#searchWrap{position:relative;flex:1;min-width:150px;max-width:280px}
#searchWrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3)}
#q{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--tx);font-size:13px;padding:7px 10px 7px 32px;outline:none;transition:border-color .15s}
#q:focus{border-color:rgba(247,201,72,.5)}
#q::placeholder{color:var(--tx3)}
#counts{font-size:11.5px;color:var(--tx3);white-space:nowrap;margin-left:auto}

/* ── 스냅샷 배너 ── */
#banner{display:none;align-items:center;gap:8px;padding:6px 16px;background:rgba(247,201,72,.08);border-bottom:1px solid rgba(247,201,72,.25);color:#E8CE7E;font-size:12px;flex-shrink:0}
#banner.show{display:flex}
#banner button{color:var(--gold);text-decoration:underline;font-size:12px}

/* ── 메인 ─────────────────────────── */
#main{flex:1;position:relative;overflow:hidden;min-height:0}
#treemap{position:absolute;inset:0;padding:8px}
.sector{position:absolute;display:flex;flex-direction:column;border-radius:4px;overflow:hidden;background:rgba(148,163,196,.05);outline:1px solid rgba(148,163,196,.12)}
.sh{display:flex;align-items:center;gap:8px;height:22px;padding:0 9px;flex-shrink:0;background:rgba(148,163,196,.09);font-size:10.5px;letter-spacing:.05em;color:var(--tx2);white-space:nowrap;overflow:hidden}
.sh b{color:var(--tx);font-weight:700;font-size:10.5px}
.sh .mono{font-size:10.5px}
.sbody{position:relative;flex:1;min-height:0}
.tile{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;border-radius:2px;outline:1px solid var(--bg);cursor:pointer;user-select:none;transition:filter .12s}
.tile:hover{filter:brightness(1.25);z-index:3}
.tile .tn{font-weight:700;line-height:1.15;max-width:96%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.tile .tp{font-family:var(--mono);font-weight:600;line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.tile .tpr{font-family:var(--mono);opacity:.75;line-height:1.1}
.tile.dim{opacity:.14;pointer-events:none}
.sector.dim{opacity:.25}
#legend{display:flex;align-items:center;gap:4px;padding:6px 16px;border-top:1px solid var(--line);background:var(--panel);font-size:10px;color:var(--tx3);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
#legend::-webkit-scrollbar{display:none}
#legend .sw{padding:2px 8px;border-radius:3px;font-family:var(--mono);font-size:9.5px;color:rgba(255,255,255,.85);white-space:nowrap}
#legend .lb{margin:0 6px 0 10px;white-space:nowrap}

/* ── 리스트 ── */
#listwrap{position:absolute;inset:0;overflow:auto}
#listwrap table{width:100%;border-collapse:collapse;font-size:13px}
#listwrap th{position:sticky;top:0;background:var(--panel);color:var(--tx2);font-weight:600;font-size:11px;text-align:right;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
#listwrap th:nth-child(2),#listwrap th:nth-child(3){text-align:left}
#listwrap td{padding:9px 14px;border-bottom:1px solid rgba(148,163,196,.07);text-align:right;white-space:nowrap}
#listwrap td:nth-child(2),#listwrap td:nth-child(3){text-align:left}
#listwrap tr{cursor:pointer}
#listwrap tbody tr:hover{background:rgba(148,163,196,.06)}
#listwrap .rank{color:var(--tx3);font-size:11px}
#listwrap .sec{color:var(--tx2);font-size:11.5px}
.up{color:var(--up)} .dn{color:var(--dn)} .fl{color:var(--tx2)}

/* ── 툴팁/모달 ── */
#tooltip{position:fixed;display:none;pointer-events:none;background:rgba(11,19,34,.97);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.5);min-width:190px}
#tooltip .tth{display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-bottom:7px}
#tooltip .tth b{font-size:13.5px}
#tooltip .tth span{font-family:var(--mono);font-size:11px;color:var(--tx3)}
#tooltip .row{display:flex;justify-content:space-between;gap:16px;padding:2px 0;color:var(--tx2)}
#tooltip .row span:last-child{color:var(--tx);font-family:var(--mono);font-size:11.5px}
#modal{position:fixed;inset:0;background:rgba(4,7,14,.7);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
#modal.show{display:flex}
#mcard{background:var(--panel2);border:1px solid var(--line);border-radius:14px;width:400px;max-width:100%;max-height:86vh;overflow:auto;padding:22px;position:relative}
#mcard .mx{position:absolute;top:12px;right:12px;color:var(--tx3);font-size:18px;padding:4px 8px}
#mcard .mx:hover{color:var(--tx)}
#mhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
#mhead b{font-size:19px;font-weight:800}
#mhead span{font-family:var(--mono);font-size:11.5px;color:var(--tx3)}
#msec{font-size:11px;color:var(--gold);margin-bottom:14px;letter-spacing:.04em}
#mprice{font-family:var(--mono);font-size:28px;font-weight:600;line-height:1}
#mchg{font-family:var(--mono);font-size:13px;margin:6px 0 16px}
#mgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;font-size:12px}
#mgrid .row{display:flex;justify-content:space-between;gap:10px;color:var(--tx2);border-bottom:1px solid rgba(148,163,196,.08);padding-bottom:4px}
#mgrid .row span:last-child{color:var(--tx);font-family:var(--mono);font-size:11.5px;text-align:right}
#mlink{display:block;margin-top:18px;text-align:center;padding:9px;border:1px solid var(--line);border-radius:8px;color:var(--tx2);font-size:12.5px;text-decoration:none;transition:border-color .15s,color .15s}
#mlink:hover{border-color:var(--gold);color:var(--gold)}
#mnote{margin-top:12px;font-size:10.5px;color:var(--tx3);line-height:1.5}

footer{padding:8px 16px;border-top:1px solid var(--line);background:var(--panel);font-size:10.5px;color:var(--tx3);display:flex;gap:14px;flex-wrap:wrap;flex-shrink:0}
footer a{color:var(--tx2)}
@media(max-width:760px){
  #topbar{height:auto;padding:8px 12px;flex-wrap:wrap;gap:8px}
  #chips{order:3;width:100%;overflow-x:auto}
  #toolbar{padding:8px 12px;gap:8px}
  #counts{display:none}
  #main{min-height:64vh}
  #treemap{padding:5px}
  .sh{height:18px;font-size:9px;padding:0 6px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<header id="topbar">
  <div class="wordmark"><span class="dia">◆</span><b>KOSMAP</b><small>한국 주식 히트맵</small></div>
  <div id="chips"></div>
  <div class="spacer"></div>
  <div id="status"><span class="dot"></span><span id="statusTx">…</span></div>

    갱신
  </button>
</header>

<div id="toolbar">

  </div>
  <div class="seg" id="viewSeg">

    <button data-v="list">리스트</button>

  </div>
  <div class="seg" id="sizeSeg" title="타일 면적 기준 — 압축: √시가총액, 실시총: 실제 시가총액, 균등: 모두 동일">
    <button data-s="sqrt" class="on">압축</button>
    <button data-s="real">실시총</button>
    <button data-s="eq">균등</button>

  <span id="counts"></span>
</div>

<div id="banner"><span>⬤</span><span id="bannerTx"></span><button id="retryBtn">다시 시도</button></div>

<main id="main">
  <div id="treemap"></div>
  <div id="listwrap" hidden>
    <table>
      <thead><tr><th>#</th><th>종목</th><th>섹터</th><th>현재가</th><th>전일비</th><th>등락률</th><th>시가총액</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<div id="legend"></div>

<footer>
  <span>데이터: 네이버 금융 · 야후 파이낸스 (지연 표시 가능)</span>
  <span id="footTs"></span>
  <span>투자 판단의 참고용이며 거래 근거로 사용할 수 없습니다.</span>
</footer>

<div id="tooltip"></div>

<div id="modal"><div id="mcard">
  <button class="mx" id="mx">✕</button>
  <div id="mhead"><b id="mname"></b><span id="mcode"></span></div>
  <div id="msec"></div>
  <div id="mprice" class="mono"></div>
  <div id="mchg" class="mono"></div>
  <div id="mgrid"></div>
  <a id="mlink" target="_blank" rel="noopener">네이버 증권에서 상세 보기 ↗</a>
  <div id="mnote">상세 수치는 네이버 금융에서 실시간 조회합니다. 조회에 실패하면 마지막 스냅샷 값만 표시됩니다.</div>
</div></div>

const S = {
  market:'KOSPI', view:'treemap', color:'kr', size:'sqrt', q:'',
  live:false, lastUpdate:null,
  stocks:{KOSPI:[], KOSDAQ:[]},
  indexes:null, snapTs:null, liveTs:null,
  timer:null, detailCache:{}
};
const $=s=>document.querySelector(s);
const fmtInt=n=>Math.round(n).toLocaleString('ko-KR');
const fmtPct=v=>(v>0?'+':v<0?'':'')+v.toFixed(2)+'%';
const fmtDiff=v=>(v>0?'+':'')+fmtInt(v);
function fmtMcap(eok){ // 억원
  if(eok==null) return '—';
  if(eok>=10000) return (eok/10000).toLocaleString('ko-KR',{maximumFractionDigits:eok>=100000?0:1})+'조';
  return fmtInt(eok)+'억';
}
const fmtPrice=p=>fmtInt(p)+'원';
const cls=v=>v>0?'up':v<0?'dn':'fl';
const sign=v=>v>0?'▲':v<0?'▼':'';

/* ═══════════════ 초기화 ═══════════════ */
function boot(){
  if(!SNAPSHOT){
    $('#main').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--tx3);font-size:13px">스냅샷 데이터가 없습니다. 페이지를 새로고침해 주세요.</div>';
    return;
  }
  S.snapTs=SNAPSHOT.ts;
  S.indexes=SNAPSHOT.indexes;
  const conv=rows=>rows.map(r=>({c:r[0],n:r[1],s:r[2],p:r[3],d:r[4],m:r[5],lp:r[3],ld:r[4]}));
  S.stocks.KOSPI=conv(SNAPSHOT.kospi);
  S.stocks.KOSDAQ=conv(SNAPSHOT.kosdaq);
  bind();
  update();
  renderLegend();
  setStatus();
  autoLoop();
  if(marketPhase().open) refresh(true); // 장중에만 실시간 시도 — 장 마감 후엔 실패 배너 없이 스냅샷(오늘 종가) 유지
}
function rows(){ return S.stocks[S.market]; }

/* ═══════════════ 렌더 ═══════════════ */
function matched(st){
  if(!S.q) return true;
  const q=S.q.toLowerCase();
  return st.n.toLowerCase().includes(q)||st.c.includes(q);
}
function update(){
  renderChips();
  if(S.view==='treemap') renderTreemap(); else renderList();
  const r=rows(), m=matched;
  const n=r.filter(m).length, secs=new Set(r.filter(m).map(x=>x.s)).size;
  $('#counts').textContent=`${n}종목 · ${secs}섹터`;
  $('#footTs').textContent=`스냅샷 ${S.snapTs} 장 마감 기준`+(S.liveTs?` · 실시간 ${S.liveTs}`:'');
  setBanner();
}
function renderChips(){
  const i=S.indexes||{}; const c=$('#chips'); c.innerHTML='';
  const mk=(lb,o)=>{ if(!o||o.v==null) return;
    const cl=cls(o.p);
    c.insertAdjacentHTML('beforeend',
      `<div class="chip"><span class="lb">${lb}</span><span class="vl mono">${fmtInt(o.v)}</span><span class="vl mono ${cl}">${o.d!=null?sign(o.p)+' '+fmtDiff(o.d):''} ${o.p!=null?fmtPct(o.p):''}</span></div>`);
  };
  mk('코스피',i.kospi); mk('코스닥',i.kosdaq); mk('USD/KRW',i.usdkrw&&{v:i.usdkrw.v,d:i.usdkrw.d,p:i.usdkrw.p});
}

/* ── 스퀘리파이 트리맵 ── */
function squarify(items,x,y,w,h,cb){
  const tot=items.reduce((a,b)=>a+b.value,0); if(tot<=0||w<2||h<2) return;
  const scale=w*h/tot;
  const its=items.map(it=>({it,a:it.value*scale}));
  let px=x,py=y,pw=w,ph=h,row=[],i=0;
  const worst=(r,side)=>{const s=r.reduce((a,q)=>a+q.a,0);const mx=Math.max(...r.map(q=>q.a)),mn=Math.min(...r.map(q=>q.a));return Math.max(side*side*mx/(s*s),(s*s)/(side*side*mn));};
  const flush=()=>{ if(!row.length) return;
    const s=row.reduce((a,q)=>a+q.a,0);
    if(pw>=ph){const rw=s/ph;let yy=py;for(const q of row){const hh=q.a/rw;cb(q.it,px,yy,rw,hh);yy+=hh;}px+=rw;pw-=rw;}
    else{const rh=s/pw;let xx=px;for(const q of row){const ww=q.a/rh;cb(q.it,xx,py,ww,rh);xx+=ww;}py+=rh;ph-=rh;}
    row=[];
  };
  while(i<its.length){
    const side=Math.max(1,Math.min(pw,ph));
    if(!row.length||worst(row.concat(its[i]),side)<=worst(row,side)){row.push(its[i]);i++;}
    else flush();
  }
  flush();
}
function renderTreemap(){
  const box=$('#treemap');
  const W=box.clientWidth-16, H=box.clientHeight-16;
  box.innerHTML='';
  if(W<40||H<40) return;
  const data=rows().filter(matched);
  if(!data.length){ box.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--tx3);font-size:13px">검색 결과가 없습니다</div>'; return; }
  const secs={};
  for(const st of data){ (secs[st.s]??=[]).push(st); }
  const wv=st=>S.size==='real'?st.m:S.size==='eq'?1:Math.sqrt(st.m);
  const secList=Object.entries(secs).map(([s,sts])=>({s,sts,value:sts.reduce((a,b)=>a+wv(b),0)})).sort((a,b)=>b.value-a.value);
  squarify(secList,8,8,W,H,(sec,sx,sy,sw,sh)=>{
    const d=document.createElement('div'); d.className='sector'+(matched({n:sec.s,c:'',s:sec.s})?'':' dim');
    d.style.left=sx+'px'; d.style.top=sy+'px'; d.style.width=sw+'px'; d.style.height=sh+'px';
    const wavg=sec.sts.reduce((a,b)=>a+b.d*wv(b),0)/sec.value;
    d.innerHTML=`<div class="sh"><b>${esc(sec.s)}</b><span class="mono ${cls(wavg)}">${fmtPct(wavg)}</span><span style="margin-left:auto;opacity:.6">${sec.sts.length}</span></div><div class="sbody"></div>`;
    box.appendChild(d);
    const body=d.querySelector('.sbody'), bw=body.clientWidth, bh=body.clientHeight;
    const sts=[...sec.sts].sort((a,b)=>b.m-a.m);
    squarify(sts.map(st=>({st,value:wv(st)})),0,0,bw,bh,(o,tx2,ty,tw,th)=>{
      const t=document.createElement('div'); t.className='tile'+(matched(o.st)?'':' dim');
      t.style.left=tx2+'px'; t.style.top=ty+'px'; t.style.width=tw+'px'; t.style.height=th+'px';
      t.style.background=tileColor(o.st.ld);
      t.dataset.c=o.st.c;
      const area=tw*th, fs=Math.max(8.5,Math.min(19,Math.sqrt(area)/4.6));
      let html=`<b class="tn" style="font-size:${fs}px">${esc(o.st.n)}</b>`;
      if(area>650) html+=`<span class="tp" style="font-size:${fs*0.82}px">${fmtPct(o.st.ld)}</span>`;
      if(tw>96&&th>62) html+=`<span class="tpr" style="font-size:${fs*0.62}px">${fmtPrice(o.st.lp)}</span>`;
      t.innerHTML=html;
      body.appendChild(t);
    });
  });
}
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function tileColor(pct){
  const a=Math.abs(pct||0);
  if(a<0.005) return '#3A4356';
  const kr=pct>0
    ?['#8A2A22','#B3271F','#D93A2E','#FF4A3C','#FF7A6E']
    :['#1B2F80','#2547B8','#3661E8','#4B7BFF','#7FA3FF'];
  const gl=pct>0
    ?['#166534','#15803D','#22C55E','#4ADE80','#86EFAC']
    :['#7F1D1D','#B91C1C','#EF4444','#F87171','#FCA5A5'];
  const pal=(S.color==='kr'?kr:gl);
  const i=a<0.5?4:a<1?3:a<2?2:a<4?1:0;
  return pal[i];
}
function renderLegend(){
  const L=$('#legend');
  const rows=[[4,'▲ 4% 이상'],[2,'▲ 2~4%'],[1,'▲ 1~2%'],[0.5,'▲ 0.5~1%'],[0.1,'~보합'],[-0.1,'~보합'],[-0.5,'▼ 0.5~1%'],[-1,'▼ 1~2%'],[-2,'▼ 2~4%'],[-4,'▼ 4% 이상']];
  L.innerHTML='<span class="lb">등락률</span>'+rows.map(([v,l])=>`<span class="sw" style="background:${tileColor(v)}">${l}</span>`).join('');
}
function renderList(){
  const tb=$('#tbody'); const data=[...rows()].filter(matched).sort((a,b)=>b.m-a.m);
  tb.innerHTML=data.map((st,i)=>`<tr data-c="${st.c}">
    <td class="mono rank">${i+1}</td>
    <td><b>${esc(st.n)}</b></td>
    <td class="sec">${esc(st.s)}</td>
    <td class="mono">${fmtPrice(st.lp)}</td>
    <td class="mono ${cls(st.ld)}">${sign(st.ld)} ${st.ld?fmtDiff(Math.round(st.lp*0+ (st.ld/100)/(1+st.ld/100)*st.lp)):''}</td>
    <td class="mono ${cls(st.ld)}">${fmtPct(st.ld)}</td>
    <td class="mono">${fmtMcap(st.m)}</td>
  </tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--tx3);padding:40px">검색 결과가 없습니다</td></tr>';
}

/* ═══════════════ 인터랙션 ═══════════════ */
function bind(){
  $('#mktSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.market=b.dataset.m;segOn('#mktSeg',b);update();});
  $('#viewSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.view=b.dataset.v;segOn('#viewSeg',b);$('#treemap').hidden=S.view!=='treemap';$('#listwrap').hidden=S.view!=='list';update();});
  $('#colorSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.color=b.dataset.c;segOn('#colorSeg',b);renderLegend();if(S.view==='treemap')renderTreemap();});
  $('#sizeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.size=b.dataset.s;segOn('#sizeSeg',b);if(S.view==='treemap')renderTreemap();});
  let deb; $('#q').addEventListener('input',e=>{clearTimeout(deb);deb=setTimeout(()=>{S.q=e.target.value.trim();update();},120);});
  $('#refreshBtn').addEventListener('click',()=>refresh(true));
  $('#retryBtn').addEventListener('click',()=>refresh(true));
  $('#treemap').addEventListener('mousemove',e=>{const t=e.target.closest('.tile');if(t)showTip(t,e);else hideTip();});
  $('#treemap').addEventListener('mouseleave',hideTip);
  $('#treemap').addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)openModal(t.dataset.c);});
  $('#tbody').addEventListener('click',e=>{const t=e.target.closest('tr[data-c]');if(t)openModal(t.dataset.c);});
  $('#mx').addEventListener('click',closeModal);
  $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#q').value='';S.q='';update();}});
  let ro; new ResizeObserver(()=>{clearTimeout(ro);ro=setTimeout(()=>{if(S.view==='treemap')renderTreemap();},120);}).observe($('#main'));
}
function segOn(sel,btn){document.querySelectorAll(sel+' button').forEach(b=>b.classList.toggle('on',b===btn));}
function findStock(c){return rows().find(s=>s.c===c);}

/* 툴팁 */
function showTip(t,e){
  const st=findStock(t.dataset.c); if(!st) return;
  const tip=$('#tooltip');
  tip.innerHTML=`<div class="tth"><b>${esc(st.n)}</b><span>${st.c}</span></div>
  <div class="row"><span>섹터</span><span>${esc(st.s)}</span></div>
  <div class="row"><span>현재가</span><span>${fmtPrice(st.lp)}</span></div>
  <div class="row"><span>등락률</span><span class="${cls(st.ld)}">${fmtPct(st.ld)}</span></div>
  <div class="row"><span>시가총액</span><span>${fmtMcap(st.m)}</span></div>
  <div class="row"><span>클릭</span><span style="color:var(--tx3)">상세 보기</span></div>`;
  tip.style.display='block';
  const r=tip.getBoundingClientRect();
  tip.style.left=Math.min(e.clientX+14,innerWidth-r.width-10)+'px';
  tip.style.top=Math.min(e.clientY+14,innerHeight-r.height-10)+'px';
}
function hideTip(){$('#tooltip').style.display='none';}

/* 모달 */
function openModal(c){
  const st=findStock(c); if(!st) return;
  $('#mname').textContent=st.n; $('#mcode').textContent=st.c+' · '+S.market;
  $('#msec').textContent=st.s;
  $('#mprice').textContent=fmtPrice(st.lp);
  $('#mchg').className='mono '+cls(st.ld);
  $('#mchg').textContent=`${sign(st.ld)} ${fmtPct(st.ld)}  어제 대비`;
  const grid=$('#mgrid');
  const base=[['시가총액',fmtMcap(st.m)],['데이터 기준',S.live?'실시간(야후)':'스냅샷 '+S.snapTs]];
  grid.innerHTML=base.map(([k,v])=>`<div class="row"><span>${k}</span><span>${v}</span></div>`).join('');
  $('#mlink').href='https://m.stock.naver.com/domestic/stock/'+st.c;
  $('#modal').classList.add('show');
  loadDetail(st,grid);
}
function closeModal(){$('#modal').classList.remove('show');}
async function loadDetail(st,grid){
  try{
    if(S.detailCache[st.c]){ fillDetail(S.detailCache[st.c],grid,st); return; }
    const url=`https://m.stock.naver.com/api/stock/${st.c}/integration`;
    const j=await fetchJSON(url);
    if(!j||j.isError) throw 0;
    S.detailCache[st.c]=j;
    fillDetail(j,grid,st);
  }catch(e){/* 스냅샷 값 유지 */}
}
function fillDetail(j,grid,st){
  const ti={}; (j.totalInfos||[]).forEach(t=>ti[t.key]=t.value);
  const rowsD=[
    ['시가',ti['시가']||'—'],['고가',ti['고가']||'—'],
    ['저가',ti['저가']||'—'],['전일',ti['전일']||'—'],
    ['거래량',ti['거래량']||'—'],['시가총액',ti['시총']||fmtMcap(st.m)],
    ['PER',ti['PER']||'—'],['배당수익률',ti['배당수익률']||'—'],
    ['52주 최고',ti['52주 최고']||'—'],['52주 최저',ti['52주 최저']||'—'],
  ];
  grid.innerHTML=rowsD.map(([k,v])=>`<div class="row"><span>${k}</span><span>${esc(String(v))}</span></div>`).join('');
}

/* ═══════════════ 데이터 갱신 (실시간) ═══════════════ */
const PROXIES=[
  u=>u,
  u=>'https://api.cors.lol/?url='+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u),
];
async function fetchJSON(url){
  for(const p of PROXIES){
    try{
      const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch(p(url),{signal:ctl.signal});
      clearTimeout(t);
      if(!r.ok) continue;
      const j=await r.json();
      if(j) return j;
    }catch(e){}
  }
  throw new Error('all proxies failed');
}
function chunk(a,n){const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o;}
async function refresh(manual){
  const btn=$('#refreshBtn'); btn.classList.add('spin');
  const sts=rows();
  const syms=sts.map(s=>s.c+(S.market==='KOSPI'?'.KS':'.KQ'));
  const idxSyms=['^KS11','^KQ11','USDKRW=X'];
  try{
    const groups=chunk([...idxSyms,...syms],20);
    const res=await Promise.all(groups.map(g=>
      fetchJSON('https://query1.finance.yahoo.com/v7/finance/spark?symbols='+g.map(encodeURIComponent).join(',')+'&range=1d&interval=1d')
    ));
    const map={};
    for(const j of res){
      for(const r2 of (j?.spark?.result||[])){
        const m=r2?.response?.[0]?.meta;
        if(m) map[m.symbol]=m;
      }
    }
    let got=0;
    for(const st of sts){
      const m=map[st.c+(S.market==='KOSPI'?'.KS':'.KQ')];
      if(m&&m.regularMarketPrice!=null){
        st.lp=m.regularMarketPrice;
        st.ld=m.regularMarketChangePercent??st.ld;
        st.m=Math.round(st.m*(st.lp/st.p));
        got++;
      }
    }
    const im={};
    for(const k of ['^KS11','^KQ11','USDKRW=X']) if(map[k]) im[k]=map[k];
    if(im['^KS11']?.regularMarketPrice!=null){
      S.indexes={kospi:{v:im['^KS11'].regularMarketPrice,d:im['^KS11'].regularMarketPrice-(im['^KS11'].chartPreviousClose||im['^KS11'].regularMarketPrice),p:im['^KS11'].regularMarketChangePercent},
                 kosdaq:im['^KQ11']?{v:im['^KQ11'].regularMarketPrice,d:im['^KQ11'].regularMarketPrice-(im['^KQ11'].chartPreviousClose||im['^KQ11'].regularMarketPrice),p:im['^KQ11'].regularMarketChangePercent}:S.indexes?.kosdaq,
                 usdkrw:im['USDKRW=X']?{v:im['USDKRW=X'].regularMarketPrice,d:null,p:im['USDKRW=X'].regularMarketChangePercent}:S.indexes?.usdkrw};
    }
    if(got>0){
      S.live=true; S.snapTs=SNAPSHOT.ts;
      S.liveTs=new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false})+' 기준';
      update();
    } else if(manual && marketPhase().open){ setBanner('갱신 실패 — 스냅샷 유지 중'); }
  }catch(e){
    if(manual && marketPhase().open) setBanner('실시간 연결 실패 — 스냅샷 유지 중');
  }
  btn.classList.remove('spin');
  setStatus();
}
function marketPhase(){
  const now=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
  const d=now.getDay(), hm=now.getHours()*60+now.getMinutes();
  if(d===0||d===6) return {open:false,tx:'휴장 (주말)'};
  if(hm>=540&&hm<930) return {open:true,tx:'장중'};
  if(hm<540) return {open:false,tx:'개장 전 (09:00)'};
  return {open:false,tx:'장 마감 (15:30)'};
}
function setBanner(msg){
  const b=$('#banner');
  if(msg){ $('#bannerTx').textContent=msg; b.classList.add('show'); return; }
  if(!S.live && marketPhase().open){ $('#bannerTx').textContent=`오프라인 스냅샷 표시 중 — ${S.snapTs} 장 마감 기준 데이터입니다. 실시간 갱신은 브라우저에서 자동 시도됩니다.`; b.classList.add('show'); }
  else b.classList.remove('show');
}
function setStatus(){
  const p=marketPhase(), el=$('#status');
  el.classList.toggle('live',p.open&&S.live);
  el.classList.toggle('closed',!p.open||!S.live);
  $('#statusTx').textContent=p.tx+(S.lastUpdate||S.liveTs?` · ${S.liveTs||''}`:'');
}
function autoLoop(){
  setInterval(()=>{ const p=marketPhase(); if(p.open){ refresh(false); } else { setStatus(); } },60000);
  setInterval(setStatus,30000);
}
