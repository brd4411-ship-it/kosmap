name: Update KR market snapshot

# 국장 마감 후 시세 스냅샷(data/snapshot.json)을 생성해 자동 커밋한다.
#  - 07:10 UTC = 16:10 KST : 국장 마감(15:30) 직후 1차 갱신
#  - 09:00 UTC = 18:00 KST : 늦게 반영되는 종가/수정치 재확인(2차)
# 같은 거래일 데이터면 스크립트가 스스로 "변경 없음"으로 종료하므로 커밋이 생기지 않는다.
on:
  schedule:
    - cron: "10 7 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-kr-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch KR snapshot (KOSPI/KOSDAQ)
        run: python3 scripts/fetch_snapshot.py --verbose

      - name: Show resulting data
        run: |
          python3 - <<'PY'
          import json
          f = "data/snapshot.json"
          d = json.load(open(f, encoding="utf-8"))
          print(f"{f}: ts={d.get('ts')} kospi={len(d.get('kospi', []))} kosdaq={len(d.get('kosdaq', []))} source={d.get('source')} generated_at={d.get('generated_at')}")
          PY

      - name: Commit and push if data changed
        run: |
          git config user.name  "kosmap-data-bot"
          git config user.email "kosmap-data-bot@users.noreply.github.com"
          git add data/snapshot.json data/sectors.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          TS=$(python3 -c "import json;print(json.load(open('data/snapshot.json'))['ts'])")
          git commit -m "data: 국장 시세 스냅샷 자동 갱신 (${TS})"
          git push
