name: Update US market snapshot

# 미장 마감 후 시세 스냅샷(data/snapshot_us.json)을 생성해 자동 커밋한다.
#  - 22:00 UTC = 다음날 07:00 KST (서머타임 06:00 KST) : 미장 마감(16:00 ET) 이후
#  - 국장 워크플로와 분리해 서로 실패가 전파되지 않게 한다.
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-us-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch US snapshot (Yahoo primary / Nasdaq fallback)
        run: python3 scripts/fetch_snapshot_us.py --verbose --best-effort

      - name: Show resulting data
        run: |
          python3 - <<'PY'
          import json
          f = "data/snapshot_us.json"
          d = json.load(open(f, encoding="utf-8"))
          print(f"{f}: ts={d.get('ts')} rows={len(d.get('rows', []))} source={d.get('source')} generated_at={d.get('generated_at')}")
          PY

      - name: Commit and push if data changed
        run: |
          git config user.name  "kosmap-data-bot"
          git config user.email "kosmap-data-bot@users.noreply.github.com"
          git add data/snapshot_us.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          TS=$(python3 -c "import json;print(json.load(open('data/snapshot_us.json'))['ts'])")
          git commit -m "data: 미장 시세 스냅샷 자동 갱신 (${TS})"
          git push
